<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender System</title>
    <link rel ="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<style>
    .text-white{
        color:white;
    }
</style>
<body style="background-color: #141414">

    <nav class="navbar navbar-expand-lg" style="background-color:#00a65a">

        <div class="container-fluid">

            <a class="navbar-brand text-white fs-3" href="#">
                My Book Recommender
            </a>

            <ul class="navbar-nav d-flex flex-row ms-auto">

                <li class="nav-item me-4">
                    <a class="nav-link text-white" href="/">Home</a>
                </li>

                <li class="nav-item me-4">
                    <a class="nav-link text-white" href="/recommend">Recommend</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="#">Contact</a>
                </li>

            </ul>

        </div>

    </nav>


    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="text-white">Top 50 Books</h1>
            </div>

            {% for i in range(book_name|length) %}

                <div class="col-md-3 mt-4">
                    <div class="card bg-dark border-0">

                        <img class="card-img-top rounded"
                             src="{{ image[i] }}">

                        <div class="card-body">

                            <p class="text-white">{{ book_name[i] }}</p>

                            <p class="text-white">{{ author[i] }}</p>

                            <p class="text-white">Votes - {{votes[i] }}</p>

                            <p class="text-white">Rating - {{ rating[i] }}</p>

                        </div>

                    </div>
                </div>

            {% endfor %}




        </div>
    </div>

</body>
</html>
